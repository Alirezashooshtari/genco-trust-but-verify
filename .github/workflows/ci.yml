name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Recompute every number in the write-up
        run: python scripts/headline_numbers.py
      - name: Redraw the figures and rebuild the demo
        run: |
          python scripts/make_figures.py
          python scripts/build_demo.py
      # figures/ is redrawn as a smoke test but not compared byte for byte: image bytes vary with the Matplotlib build
      # and the fonts installed, while the numbers behind every figure are in results/ and are compared.
      - name: The committed numbers and the demo are reproduced exactly
        run: git diff --exit-code -- results/ demo/index.html
